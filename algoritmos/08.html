<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        window.fetch('http://127.0.0.1:5500/algoritmos/produtos.json').then((resposta) => resposta.json()).then((produtos) => {
            let soma = 0;
            produtos.forEach((produto) => {
                soma += produto.preco;
            });
            console.log(soma);
        });

    </script>
</body>

</html>
